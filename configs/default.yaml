dataset: rsna
data_dir: null
task: stenosis
image_size: 224
use_25d: true
box_size: 32
use_oracle_regions: true
num_workers: 4

seed: 42
val_frac: 0.15
test_frac: 0.15

tokenizer: anatomy
roi_output_size: 7

backbone: dinov2_vits14
freeze_backbone: true
backbone_dim: 384
patch_size: 14

embed_dim: 256
encoder_layers: 2
encoder_heads: 4
dropout: 0.1
max_levels: 24
pos_encoding: ordinal

head: ce
num_stenosis_classes: 3
num_pfirrmann_classes: 5

batch_size: 16
lr: 0.0001
weight_decay: 0.01
epochs: 100
patience: 10
grad_clip: 1.0
class_weight: sqrt_inverse
select_metric: kappa
select_window: 3
device: cuda

output_dir: outputs
